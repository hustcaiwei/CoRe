[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core-ljp"
version = "0.1.0"
description = "Collaborative Reasoning with Reranked Multi-facet Retrieval for Legal Judgment Prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "faiss-cpu>=1.8,<2",
  "openai>=1.30,<3",
  "json-repair>=0.30,<1",
  "scikit-learn>=1.4,<2",
]

[project.scripts]
core-ljp = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*"]
